      context: ./services/tts
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models
    networks:
      - bug_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - STT_SERVICE=http://stt:5001
      - LLM_SERVICE=http://llm:5002
      - TTS_SERVICE=http://tts:5003
      - WAKE_WORD_SERVICE=http://wake_word:5105
    depends_on:
      stt:
        condition: service_healthy
      llm:
        condition: service_healthy
      tts:
        condition: service_healthy
      wake_word:
        condition: service_healthy
    networks:
      - bug_network

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:5000
      - LOG_LEVEL=INFO
    depends_on:
      - orchestrator
    networks:
      - bug_network

  gmail:
    build:
      context: ./services/gmail
      dockerfile: Dockerfile
    ports:
      - "5101:5101"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - MOCK_MODE=true
    networks:
      - bug_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5101/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  outlook:
