version: '3.8'

services:
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models
    networks:
      - bug_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  llm:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - MODEL_PATH=/app/models
    networks:
      - bug_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tts:
