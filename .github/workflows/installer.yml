name: Firmware installer

on:
  push:
    branches: [main, installer]
    paths:
      - firmware/**
      - web/**
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4

      - name: Compile firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py set-target esp32s3
          # -k 0 reports every compile error in one run instead of stopping at the first.
          ninja -C build -k 0

      - name: Check flash offsets match the manifest
        shell: bash
        run: |
          cd firmware/build
          cat flash_args
          grep -q '^0x0 bootloader/bootloader.bin$' flash_args
          grep -q '^0x8000 partition_table/partition-table.bin$' flash_args
          grep -q '^0xd000 ota_data_initial.bin$' flash_args
          grep -q '^0x10000 bug-voice-assistant.bin$' flash_args

      - name: Assemble installer site
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < firmware/version.txt)"
          mkdir -p web/firmware
          cp firmware/build/bootloader/bootloader.bin web/firmware/bootloader.bin
          cp firmware/build/partition_table/partition-table.bin web/firmware/partitions.bin
          cp firmware/build/ota_data_initial.bin web/firmware/ota_data.bin
          cp firmware/build/bug-voice-assistant.bin web/firmware/app.bin
          sed -i "s/__VERSION__/$version/g" web/index.html web/manifest.json
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" web/index.html
          ls -l web web/firmware

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
